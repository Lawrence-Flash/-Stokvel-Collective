services:
  postgres:
    image: postgres:16-alpine
    container_name: stokvel_postgres
    environment:
      POSTGRES_USER: stokvel_user
      POSTGRES_PASSWORD: stokvel_secure_password
      POSTGRES_DB: stokvel_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stokvel_user -d stokvel_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: stokvel_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: stokvel_adminer
    ports:
      - "8085:8080"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
