name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint Check
        run: pnpm lint
      - name: Type Check
        run: pnpm typecheck
      - name: Unit Tests
        run: pnpm test
      - name: Build
        run: pnpm build
      # Known high and critical advisories are in Next.js 14 and Vitest 1.
      # Their fixes are major upgrades, so this step reports them without
      # failing the job. Dependency Review blocks new vulnerable dependencies.
      - name: Dependency audit
        continue-on-error: true
        run: pnpm audit --audit-level=high
